<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gathm AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">

        <!-- ── Orb hero ─────────────────────────────────────── -->
        <div class="orb-scene">
            <div class="ai-orb idle" id="aiOrb">
                <div class="orb-ambient"></div>
                <div class="orb-wrapper" id="orbWrapper">
                    <div class="orb-ring ring-1"></div>
                    <div class="orb-ring ring-2"></div>
                    <div class="orb-ring ring-3"></div>
                    <div class="main-orb" id="mainOrb">
                        <div class="orb-swirl"></div>
                        <div class="orb-gloss"></div>
                    </div>
                </div>
                <div class="freq-bars" id="freqBars">
                    <div class="fb"></div>
                    <div class="fb"></div>
                    <div class="fb"></div>
                    <div class="fb"></div>
                    <div class="fb"></div>
                    <div class="fb"></div>
                    <div class="fb"></div>
                    <div class="fb"></div>
                </div>
            </div>
            <h1 class="orb-name">Gathm AI</h1>
            <p class="orb-status" id="botStatus">Checking…</p>
        </div>

        <!-- ── Chat messages ────────────────────────────────── -->
        <div class="messages-area" id="chatArea"></div>

        <!-- ── Input ────────────────────────────────────────── -->
        <div class="input-area">
            <div class="input-row">
                <div class="text-input-wrapper">
                    <!-- textarea, not input: a long prompt has to stay readable
                         while it is being typed. Grows to a few lines, then
                         scrolls. Enter sends, Shift+Enter makes a newline. -->
                    <textarea id="messageInput" rows="1"
                              placeholder="Ask anything…  (/clear to reset)"
                              autocomplete="off"></textarea>
                </div>
                <button class="action-btn send-btn" id="sendBtn" aria-label="Send">
                    <i data-lucide="send" class="btn-icon"></i>
                </button>
                <button class="action-btn mic-btn" id="micBtn" aria-label="Voice input">
                    <i data-lucide="mic" class="btn-icon"></i>
                </button>
                <!-- Shown only when the server reports a working voice runtime -->
                <button class="action-btn speak-btn" id="speakBtn"
                        aria-label="Speak replies" hidden>
                    <i data-lucide="volume-2" class="btn-icon"></i>
                </button>
            </div>
        </div>

    </div>
    <script src="app.js"></script>
</body>
</html>
