name: googler
version: "3.0.0"
description: "Google search from the command line. Use -j for JSON output and --np for non-interactive mode."
category: data

dependencies:
  system: [python3]

apis:
  - name: google
    base_url: https://www.google.com
    health_endpoint: https://www.google.com
    auth_required: false

input_schema:
  arguments:
    - name: query
      type: string
      required: true
      description: "Search query"
  flags:
    - flag: "-n"
      description: "Number of results"
      has_argument: true
    - flag: "-h"
      description: "Show help"
    - flag: "-j"
      description: "Output in JSON format (recommended for AI)"
    - flag: "--np"
      description: "Non-interactive mode (prevents omniprompt)"
    - flag: "-N"
      description: "Search in news section"

output_schema:
  text: "Search results with titles, URLs, and snippets"
  json_fields:
    - name: results
      type: array
      items:
        - name: title
          type: string
        - name: url
          type: string
        - name: snippet
          type: string

fallback_tool: null
tags: [data, search, google, web]
