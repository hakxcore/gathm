name: headersaudit
version: "3.0.0"
description: "HTTP security headers audit with coverage score and missing-header report"
category: security

dependencies:
  system: [curl, python3]

input_schema:
  arguments:
    - name: target
      type: string
      required: true
      description: "URL or host to inspect"
  flags:
    - flag: "-k"
      description: "Skip TLS verification"
    - flag: "-t"
      description: "Request timeout seconds"
      has_argument: true
    - flag: "-h"
      description: "Show help"
    - flag: "-v"
      description: "Show version"

output_schema:
  text: "Security header coverage score with present/missing header details"
  json_fields:
    - name: target
      type: string
    - name: http_status
      type: number
    - name: header_security_score
      type: number
    - name: missing_headers
      type: array

fallback_tool: httpprobe
tags: [security, headers, csp, hsts, xfo, audit]
