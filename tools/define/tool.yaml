name: define
version: "3.0.0"
description: "Word definitions, meanings, and examples"
category: data

dependencies:
  system: [curl, jq]

apis:
  - name: dictionaryapi
    base_url: https://api.dictionaryapi.dev/api/v2/entries
    health_endpoint: https://api.dictionaryapi.dev/api/v2/entries/en/hello
    auth_required: false

input_schema:
  arguments:
    - name: word
      type: string
      required: true
      description: "Word to define"
  flags:
    - flag: "-h"
      description: "Show help"
    - flag: "-v"
      description: "Show version"

output_schema:
  text: "Word definition and examples"
  json_fields:
    - name: word
      type: string
    - name: definition
      type: string
    - name: example
      type: string
    - name: part_of_speech
      type: string

fallback_tool: null
tags: [data, dictionary, language, definition, words]
