name: katana
version: "3.0.0"
description: "ProjectDiscovery katana wrapper for crawling and endpoint discovery"
category: security

dependencies:
  system: [katana]

input_schema:
  arguments:
    - name: target
      type: string
      required: true
      description: "Target URL"
  flags:
    - flag: "-h"
      description: "Show help"
    - flag: "-v"
      description: "Show version"

output_schema:
  text: "Crawled endpoints and assets"
  json_fields:
    - name: endpoint
      type: string

fallback_tool: robotsaudit
tags: [projectdiscovery, katana, crawl, endpoint, security]
