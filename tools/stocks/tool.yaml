name: stocks
version: "3.0.0"
description: "Get real-time STOCK market prices (NASDAQ, NYSE, etc.) for a given ticker symbol. Use this for companies like Apple (AAPL), Google (GOOGL), or Microsoft (MSFT). DO NOT use for Bitcoin or Ethereum."
category: finance

dependencies:
  system: [curl, python3]

input_schema:
  arguments:
    - name: ticker
      type: string
      required: true
      description: "Stock ticker symbol (e.g., AAPL, TSLA, MSFT)"

output_schema:
  text: "Stock details including latest price, exchange, and currency"

tags: [finance, stocks, markets, investment]
