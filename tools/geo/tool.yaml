name: geo
version: "3.0.0"
description: "Provides WAN/LAN IP, router, DNS, MAC, and geolocation data"
category: networking
requires_internet: true

dependencies:
  system: [curl]

apis:
  - name: ipify
    base_url: https://api.ipify.org
    health_endpoint: https://api.ipify.org
    auth_required: false
  - name: ip-api
    base_url: http://ip-api.com
    health_endpoint: http://ip-api.com/json
    auth_required: false
  - name: ipinfo
    base_url: https://ipinfo.io
    health_endpoint: https://ipinfo.io
    auth_required: false

input_schema:
  arguments: []
  flags:
    - flag: "-w"
      description: "Returns WAN IP"
    - flag: "-l"
      description: "Returns LAN IP(s)"
    - flag: "-r"
      description: "Returns Router IP"
    - flag: "-d"
      description: "Returns DNS Nameserver(s)"
    - flag: "-m"
      description: "Returns MAC address for interface"
      has_argument: true
    - flag: "-g"
      description: "Returns geolocation data"
    - flag: "-a"
      description: "Specify IP for geolocation"
      has_argument: true
    - flag: "-h"
      description: "Show help"
    - flag: "-v"
      description: "Show version"

output_schema:
  text: "Network and geolocation information"
  json_fields:
    - name: wan_ip
      type: string
    - name: lan_ips
      type: array
    - name: router_ip
      type: string
    - name: dns_servers
      type: array
    - name: mac_address
      type: string
    - name: geolocation
      type: object

fallback_tool: ipinfo
tags: [networking, ip, geolocation, dns, mac, lan, wan]
