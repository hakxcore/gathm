name: wafdetect
version: "3.0.0"
description: "Likely WAF/CDN detector using HTTP header and response fingerprinting"
category: security
requires_internet: true

dependencies:
  system: [curl]

input_schema:
  arguments:
    - name: target
      type: string
      required: true
      description: "URL or host to inspect"
  flags:
    - flag: "-k"
      description: "Skip TLS verification"
    - flag: "-t"
      description: "Request timeout seconds"
      has_argument: true
    - flag: "-h"
      description: "Show help"
    - flag: "-v"
      description: "Show version"

output_schema:
  text: "Likely WAF provider(s) and matched header indicators"
  json_fields:
    - name: target
      type: string
    - name: http_status
      type: number
    - name: likely_waf
      type: array
    - name: indicators
      type: array

fallback_tool: httpprobe
tags: [security, waf, cloudflare, akamai, imperva, detection]
