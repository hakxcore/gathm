name: dns
version: "3.0.0"
description: "DNS record lookup (A/AAAA/CNAME/MX/TXT/NS/etc.) via DNS-over-HTTPS"
category: networking

dependencies:
  system: [curl, python3]

apis:
  - name: dns.google
    base_url: https://dns.google/resolve
    health_endpoint: https://dns.google/resolve?name=example.com&type=A
    auth_required: false

input_schema:
  arguments:
    - name: domain
      type: string
      required: true
      description: "Domain name to resolve"
  flags:
    - flag: "-t"
      description: "Record type (A, AAAA, CNAME, MX, TXT, NS, SOA, PTR, CAA, SRV, ANY)"
      has_argument: true
    - flag: "-h"
      description: "Show help"
    - flag: "-v"
      description: "Show version"

output_schema:
  text: "DNS query status and answer records with TTL values"
  json_fields:
    - name: query
      type: string
    - name: status
      type: string
    - name: answers
      type: array

fallback_tool: null
tags: [networking, dns, doh, records, mx, txt, ns]
