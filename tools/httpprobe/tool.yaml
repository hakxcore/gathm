name: httpprobe
version: "3.0.0"
description: "HTTP(S) endpoint probe with status code, headers, IP, and latency"
category: networking

dependencies:
  system: [curl]

input_schema:
  arguments:
    - name: target
      type: string
      required: true
      description: "URL or host to probe"
  flags:
    - flag: "-m"
      description: "Max request time in seconds"
      has_argument: true
    - flag: "-k"
      description: "Skip TLS cert verification"
    - flag: "-h"
      description: "Show help"
    - flag: "-v"
      description: "Show version"

output_schema:
  text: "HTTP status, final URL, remote IP, latency, and key response headers"
  json_fields:
    - name: http_status
      type: number
    - name: final_url
      type: string
    - name: remote_ip
      type: string
    - name: time_total
      type: number

fallback_tool: null
tags: [networking, http, https, headers, latency, uptime]
