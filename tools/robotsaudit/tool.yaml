name: robotsaudit
version: "3.0.0"
description: "robots.txt analyzer for crawl directives, sitemaps, and sensitive path hints"
category: security
requires_internet: true

dependencies:
  system: [curl, python3]

input_schema:
  arguments:
    - name: target
      type: string
      required: true
      description: "URL or host to inspect"
  flags:
    - flag: "-k"
      description: "Skip TLS verification"
    - flag: "-t"
      description: "Request timeout seconds"
      has_argument: true
    - flag: "-h"
      description: "Show help"
    - flag: "-v"
      description: "Show version"

output_schema:
  text: "robots.txt status, directive counts, sitemaps, and interesting disallow paths"
  json_fields:
    - name: target
      type: string
    - name: http_status
      type: number
    - name: disallow_count
      type: number
    - name: sitemap_count
      type: number

fallback_tool: httpprobe
tags: [security, robots, crawling, sitemap, web-audit]
