name: rdap
version: "3.0.0"
description: "RDAP lookup for domain ownership, registrar, and IP registration data"
category: networking

dependencies:
  system: [curl, python3]

apis:
  - name: rdap.org
    base_url: https://rdap.org
    health_endpoint: https://rdap.org/domain/example.com
    auth_required: false

input_schema:
  arguments:
    - name: target
      type: string
      required: true
      description: "Domain or IP address to query"
  flags:
    - flag: "-h"
      description: "Show help"
    - flag: "-v"
      description: "Show version"

output_schema:
  text: "RDAP registration metadata including registrar, status, and nameservers"
  json_fields:
    - name: object
      type: string
    - name: handle
      type: string
    - name: registrar
      type: string
    - name: status
      type: string
    - name: nameservers
      type: array

fallback_tool: null
tags: [networking, rdap, domain, registrar, whois, ownership]
