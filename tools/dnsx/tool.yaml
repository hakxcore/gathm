name: dnsx
version: "3.0.0"
description: "ProjectDiscovery dnsx wrapper for DNS resolution and probing"
category: networking
requires_internet: true

dependencies:
  system: [dnsx]

input_schema:
  arguments:
    - name: domain
      type: string
      required: true
      description: "Target domain"
  flags:
    - flag: "-h"
      description: "Show help"
    - flag: "-v"
      description: "Show version"

output_schema:
  text: "DNS resolution and probing output"
  json_fields:
    - name: host
      type: string
    - name: answer
      type: string

fallback_tool: dns
tags: [projectdiscovery, dnsx, dns, resolution, networking]
