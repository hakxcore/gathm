name: qrify
version: "3.0.0"
description: "QR code generation and decoding"
category: security

dependencies:
  system: [curl]

apis:
  - name: qrenco.de
    base_url: https://qrenco.de
    health_endpoint: https://qrenco.de
    auth_required: false

input_schema:
  arguments:
    - name: text
      type: string
      required: true
      description: "Text or URL to encode as QR code"
  flags:
    - flag: "-d"
      description: "Decode a QR code image"
    - flag: "-h"
      description: "Show help"
    - flag: "-v"
      description: "Show version"

output_schema:
  text: "QR code ASCII art or decoded content"
  json_fields:
    - name: input
      type: string
    - name: qr_text
      type: string

fallback_tool: null
tags: [security, qrcode, encoding, utility]
