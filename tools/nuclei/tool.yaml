name: nuclei
version: "3.0.0"
description: "ProjectDiscovery nuclei wrapper for template-based vulnerability scanning"
category: security
requires_internet: true

dependencies:
  system: [nuclei]

input_schema:
  arguments:
    - name: target
      type: string
      required: true
      description: "Target URL/host"
  flags:
    - flag: "-h"
      description: "Show help"
    - flag: "-v"
      description: "Show version"

output_schema:
  text: "Nuclei findings output"
  json_fields:
    - name: template
      type: string
    - name: severity
      type: string
    - name: matched_at
      type: string

fallback_tool: cve
tags: [projectdiscovery, nuclei, vuln, templates, security]
