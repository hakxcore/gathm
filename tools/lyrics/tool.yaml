name: lyrics
version: "3.0.0"
description: "Song lyrics fetcher by artist and title"
category: media

dependencies:
  system: [curl]

apis:
  - name: lyrics.ovh
    base_url: https://api.lyrics.ovh/v1
    health_endpoint: https://api.lyrics.ovh
    auth_required: false

input_schema:
  arguments:
    - name: artist
      type: string
      required: true
      description: "Artist name"
    - name: song
      type: string
      required: true
      description: "Song title"
  flags:
    - flag: "-h"
      description: "Show help"
    - flag: "-v"
      description: "Show version"

output_schema:
  text: "Song lyrics"
  json_fields:
    - name: artist
      type: string
    - name: song
      type: string
    - name: lyrics
      type: string

fallback_tool: null
tags: [media, music, lyrics, entertainment]
