name: httpx
version: "3.0.0"
description: "ProjectDiscovery httpx wrapper for HTTP endpoint probing"
category: networking
requires_internet: true

dependencies:
  system: [httpx]

input_schema:
  arguments:
    - name: target
      type: string
      required: true
      description: "Target URL/host"
  flags:
    - flag: "-h"
      description: "Show help"
    - flag: "-v"
      description: "Show version"

output_schema:
  text: "HTTP probe output"
  json_fields:
    - name: url
      type: string
    - name: status_code
      type: number

fallback_tool: httpprobe
tags: [projectdiscovery, httpx, web, probe, networking]
