name: subdomains
version: "3.0.0"
description: "Subdomain discovery using certificate transparency records"
category: networking
requires_internet: true

dependencies:
  system: [curl, python3]

apis:
  - name: crtsh
    base_url: https://crt.sh
    health_endpoint: https://crt.sh/?q=%25.example.com&output=json
    auth_required: false

input_schema:
  arguments:
    - name: domain
      type: string
      required: true
      description: "Root domain to enumerate"
  flags:
    - flag: "-l"
      description: "Maximum number of subdomains to display"
      has_argument: true
    - flag: "-h"
      description: "Show help"
    - flag: "-v"
      description: "Show version"

output_schema:
  text: "Unique subdomain list discovered from certificate logs"
  json_fields:
    - name: domain
      type: string
    - name: discovered_subdomains
      type: number
    - name: subdomain_list
      type: array

fallback_tool: dns
tags: [networking, osint, subdomain, discovery, crtsh, reconnaissance]
