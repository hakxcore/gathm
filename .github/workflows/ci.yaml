name: CI - Lint, Test & Validate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: ShellCheck Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Lint main entry point
        run: shellcheck -x gathm || true

      - name: Lint utility libraries
        run: |
          for f in lib/*.bash; do
            echo "Checking $f..."
            shellcheck -x "$f" || true
          done

      - name: Lint agent scripts
        run: |
          for f in agent/*.sh; do
            echo "Checking $f..."
            shellcheck -x "$f" || true
          done

      - name: Lint tool scripts
        run: |
          for dir in tools/*/; do
            tool_name=$(basename "$dir")
            tool_file="$dir/$tool_name"
            if [ -f "$tool_file" ]; then
              echo "Checking $tool_file..."
              shellcheck -x "$tool_file" || true
            fi
          done

  validate-manifests:
    name: Validate Tool Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml "pydantic>=2.0"

      - name: Validate all tool.yaml files (Pydantic schema)
        run: python3 tools/validate_manifests.py

  # Cross-platform agent smoke tests
  test-agent:
    name: Agent Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install jq || true

      - name: Show platform info
        run: |
          echo "OS: $(uname -s)"
          echo "Bash: ${BASH_VERSION}"
          echo "Shell: $SHELL"

      - name: Test agent initialization
        run: bash agent/orchestrator.sh status --json

      - name: Test tool listing
        run: bash agent/orchestrator.sh list --json

      - name: Test health check
        run: bash agent/orchestrator.sh health all --json

      - name: Test natural language query
        run: bash agent/orchestrator.sh ask "what is the weather" --json

      - name: Test task planning
        run: bash agent/orchestrator.sh plan "daily briefing" --json

  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pytest pyyaml "pydantic>=2.0" "fastapi>=0.111.0" "uvicorn[standard]>=0.29.0"

      - name: Run tests
        run: python -m pytest tests/test_core.py -v

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t gathm:test .

      - name: Test container
        run: |
          docker run --rm gathm:test gathm-agent status --json
          docker run --rm gathm:test gathm-agent list --json
